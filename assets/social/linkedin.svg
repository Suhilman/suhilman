<svg xmlns="http://www.w3.org/2000/svg" width="168" height="60" viewBox="0 0 168 60" role="img" aria-label="LinkedIn">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="pill"><rect width="168" height="60" rx="30"/></clipPath>
  </defs>
  <style>
    .run{stroke-dasharray:100 356;animation:run 4s linear infinite}
    .sw{animation:sw 4.5s ease-in-out 1s infinite}
    .in{animation:in .6s ease-out both}
    @keyframes run{to{stroke-dashoffset:-456}}
    @keyframes sw{0%{transform:translateX(-120px)}60%,100%{transform:translateX(288px)}}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.run,.sw,.in{animation:none}.run{stroke-dasharray:none;stroke-opacity:.4}}
  </style>
  <g class="in">
    <rect x="1" y="1" width="166" height="58" rx="29" fill="#111827" stroke="#334155"/>
    <rect class="run" x="1" y="1" width="166" height="58" rx="29" fill="none" stroke="url(#bd)" stroke-width="2"/>
    <rect x="22" y="14" width="32" height="32" rx="5" fill="#0A66C2"/>
      <text x="38" y="38.96" text-anchor="middle" style="font:800 21.76px Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:-1px">in</text>
    <text x="68" y="37" textLength="72" lengthAdjust="spacingAndGlyphs" style="font:500 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e5e7eb">LinkedIn</text>
    <g clip-path="url(#pill)"><rect class="sw" x="-110" width="110" height="60" fill="url(#sh)"/></g>
  </g>
</svg>
