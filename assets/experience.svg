<svg xmlns="http://www.w3.org/2000/svg" width="900" height="830" viewBox="0 0 900 830" role="img" aria-label="Experience">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#a5f3fc" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="rl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <clipPath id="card"><rect width="900" height="830" rx="22"/></clipPath>
  </defs>
  <style>
    .in{animation:in .8s cubic-bezier(.2,.8,.2,1) both}
    .run{stroke-dasharray:554 2906;animation:run 9s linear infinite}
    .sw{animation:sw 7s ease-in-out 1.5s infinite}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
    .rail{animation:draw 1.8s cubic-bezier(.2,.8,.2,1) .4s forwards}
    .spark{opacity:.85;filter:drop-shadow(0 0 4px #a5f3fc)}
    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes run{to{stroke-dashoffset:-3460}}
    @keyframes sw{0%{transform:translateX(-420px)}60%,100%{transform:translateX(1320px)}}
    @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.in,.run,.sw,.ping,.rail{animation:none}.sw,.ping,.spark{display:none}.rail{stroke-dashoffset:0!important}}
  </style>
  <g class="in">
    <foreignObject x="0" y="0" width="900" height="830">
      <div xmlns="http://www.w3.org/1999/xhtml">
        <style>
*{box-sizing:border-box;margin:0;padding:0}
.frame{width:900px;padding:1.5px;border-radius:22px;background:linear-gradient(135deg,rgba(34,211,238,.55),rgba(139,92,246,.25) 50%,rgba(236,72,153,.5))}
.root{position:relative;overflow:hidden;border-radius:21px;padding:34px 36px 36px;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
  background:radial-gradient(520px 260px at 88% 0%,rgba(34,211,238,.12),transparent 70%),
  radial-gradient(520px 300px at 0% 100%,rgba(168,85,247,.12),transparent 70%),
  linear-gradient(135deg,#0b1222,#0d1020 60%,#1a0f24)}
.root:before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px);background-size:36px 36px}
.label{position:relative;display:flex;align-items:center;gap:20px;margin-bottom:26px}
.line{width:44px;height:2px;border-radius:2px;background:linear-gradient(90deg,#22d3ee,#a855f7);transform-origin:left;animation:draw .8s ease-out both}
.lt{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:5px;color:#94a3b8}
.lr{margin-left:auto;font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;color:#64748b}
.grad{background:linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899,#22d3ee);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;color:#a5b4fc;padding:4px 9px;border-radius:7px;background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.28)}
.up{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.dot{width:9px;height:9px;border-radius:9px;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:ping 2s ease-out infinite;flex:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flow{to{background-position:300% 0}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 9px rgba(34,197,94,0)}}
/* statis: animasi dikerjakan lapisan SVG */
*{animation:none!important}.up{opacity:1}

.tl{position:relative;padding-left:0}
.rail{position:absolute;left:171px;top:8px;bottom:8px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,#22d3ee,#8b5cf6 55%,#ec4899);transform-origin:top;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) .2s both}
.job{position:relative;display:grid;grid-template-columns:150px 1fr;gap:44px}
.job + .job{margin-top:30px}
.when{text-align:right;padding-top:3px}
.d{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;color:#e2e8f0}
.loc{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;color:#64748b;margin-top:4px}
.now{display:inline-block;margin-top:8px;font:700 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:2px;color:#86efac;padding:3px 8px;border-radius:999px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35)}
.node{position:absolute;left:166px;top:5px;width:12px;height:12px;border-radius:12px;background:#0b1222;border:2px solid #a78bfa}
.node.cur{border-color:#22c55e;background:#22c55e;animation:ping 2s ease-out infinite}
.co{font:750 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;color:#f8fafc;letter-spacing:-.2px}
.role{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;margin:3px 0 12px}
ul{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
li{position:relative;padding-left:16px;font:400 14px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;color:#cbd5e1}
li:before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:2px;background:linear-gradient(135deg,#22d3ee,#a855f7)}
li b{color:#f1f5f9;font-weight:650}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.frame{height:830px}.root{height:100%}</style>
        <div class="frame"><div class="root">
<div class="label"><span class="line"></span><span class="lt">EXPERIENCE</span><span class="lr">5+ years</span></div>
<div class="tl">
  <div class="rail"></div>
  <div class="job up" style="animation-delay:0.30s">
    <div class="when"><div class="d">08/2023 — Present</div><div class="loc">Jakarta</div><div class="now">CURRENT</div></div>
    <div class="node cur"></div>
    <div>
      <div class="co">PT. BIS Data Indonesia</div>
      <div class="role grad">Front End Developer</div>
      <ul><li><b>NADIA &amp; VIONA</b> — network monitoring for the SATRIA-1 satellite HUBs (BAKTI KOMINFO) in Jayapura, Manokwari &amp; Timika: unified topology, alert routing, device status.</li><li><b>ARTZ HR &amp; BDI Chat</b> — full-stack Dart platforms: HR with RBAC &amp; audit logs, real-time messaging over WebSocket.</li><li><b>ELARA</b> enterprise AI assistant, <b>Benggala</b> procurement dashboard for LKPP, and <b>LOOKUP IP</b> internal tooling on AWS.</li></ul>
      <div class="chips"><span class="chip">Next.js</span><span class="chip">MUI</span><span class="chip">Dart</span><span class="chip">Flutter</span><span class="chip">Frog</span><span class="chip">PostgreSQL</span><span class="chip">WebSocket</span><span class="chip">JWT</span><span class="chip">AWS</span><span class="chip">Cloudflare</span><span class="chip">Google Maps API</span><span class="chip">Figma</span></div>
    </div>
  </div><div class="job up" style="animation-delay:0.55s">
    <div class="when"><div class="d">08/2021 — 08/2023</div><div class="loc">Bandung</div></div>
    <div class="node"></div>
    <div>
      <div class="co">PT. Life Tech Tanpa Batas</div>
      <div class="role grad">Front End Developer</div>
      <ul><li><b>BeetPOS &amp; BeetClinic</b> — UI/UX and back-office for a multi-tenant POS; Tokopedia, Shopee &amp; QRIS integrations.</li><li><b>CRM MRT</b> — built from scratch: payment integration, role-based dashboards, customer activity timeline.</li><li>Code reviews, staging/production deployments and cross-functional collaboration.</li></ul>
      <div class="chips"><span class="chip">React.js</span><span class="chip">Vue.js</span><span class="chip">Vuetify</span><span class="chip">REST API</span><span class="chip">Figma</span><span class="chip">Photoshop</span><span class="chip">GitHub</span></div>
    </div>
  </div><div class="job up" style="animation-delay:0.80s">
    <div class="when"><div class="d">12/2020 — 03/2021</div><div class="loc">Bogor</div></div>
    <div class="node"></div>
    <div>
      <div class="co">Cave Laundry</div>
      <div class="role grad">Full Stack Developer</div>
      <ul><li>Cashier app with real-time chat between counter and operations over WebSocket — low latency, high availability.</li><li>Deployed to staging &amp; production and iterated on store-operator feedback.</li></ul>
      <div class="chips"><span class="chip">Laravel</span><span class="chip">MySQL</span><span class="chip">Bootstrap</span><span class="chip">jQuery</span></div>
    </div>
  </div>
</div>
</div></div>
      </div>
    </foreignObject>
    <line x1="209.5" y1="84.5" x2="209.5" y2="770.2" stroke="url(#rl)" stroke-width="2.5" stroke-linecap="round" class="rail" style="stroke-dasharray:685.7;stroke-dashoffset:685.7"/>
         <circle r="4" fill="#fff" class="spark"><animateMotion dur="3.6s" repeatCount="indefinite" path="M209.5 84.5 V770.2"/></circle>
    <circle cx="209.5" cy="87.5" r="6" fill="none" stroke="#22c55e" stroke-width="2" class="ping" style="animation-delay:0.00s"/>
    <g clip-path="url(#card)"><rect class="sw" x="-400" y="0" width="400" height="830" fill="url(#sh)"/></g>
    <rect class="run" x="1" y="1" width="898" height="828" rx="21" fill="none" stroke="url(#bd)" stroke-width="2"/>
  </g>
</svg>
