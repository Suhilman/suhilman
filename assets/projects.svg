<svg xmlns="http://www.w3.org/2000/svg" width="900" height="930" viewBox="0 0 900 930" role="img" aria-label="Featured work">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#a5f3fc" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="rl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <clipPath id="card"><rect width="900" height="930" rx="22"/></clipPath>
  </defs>
  <style>
    .in{animation:in .8s cubic-bezier(.2,.8,.2,1) both}
    .run{stroke-dasharray:586 3074;animation:run 9s linear infinite}
    .sw{animation:sw 7s ease-in-out 1.5s infinite}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
    .rail{animation:draw 1.8s cubic-bezier(.2,.8,.2,1) .4s forwards}
    .spark{opacity:.85;filter:drop-shadow(0 0 4px #a5f3fc)}
    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes run{to{stroke-dashoffset:-3660}}
    @keyframes sw{0%{transform:translateX(-420px)}60%,100%{transform:translateX(1320px)}}
    @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.in,.run,.sw,.ping,.rail{animation:none}.sw,.ping,.spark{display:none}.rail{stroke-dashoffset:0!important}}
  </style>
  <g class="in">
    <foreignObject x="0" y="0" width="900" height="930">
      <div xmlns="http://www.w3.org/1999/xhtml">
        <style>
*{box-sizing:border-box;margin:0;padding:0}
.frame{width:900px;padding:1.5px;border-radius:22px;background:linear-gradient(135deg,rgba(34,211,238,.55),rgba(139,92,246,.25) 50%,rgba(236,72,153,.5))}
.root{position:relative;overflow:hidden;border-radius:21px;padding:34px 36px 36px;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;
  background:radial-gradient(520px 260px at 88% 0%,rgba(34,211,238,.12),transparent 70%),
  radial-gradient(520px 300px at 0% 100%,rgba(168,85,247,.12),transparent 70%),
  linear-gradient(135deg,#0b1222,#0d1020 60%,#1a0f24)}
.root:before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px);background-size:36px 36px}
.label{position:relative;display:flex;align-items:center;gap:20px;margin-bottom:26px}
.line{width:44px;height:2px;border-radius:2px;background:linear-gradient(90deg,#22d3ee,#a855f7);transform-origin:left;animation:draw .8s ease-out both}
.lt{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:5px;color:#94a3b8}
.lr{margin-left:auto;font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;color:#64748b}
.grad{background:linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899,#22d3ee);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;color:#a5b4fc;padding:4px 9px;border-radius:7px;background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.28)}
.up{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.dot{width:9px;height:9px;border-radius:9px;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:ping 2s ease-out infinite;flex:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flow{to{background-position:300% 0}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 9px rgba(34,197,94,0)}}
/* statis: animasi dikerjakan lapisan SVG */
*{animation:none!important}.up{opacity:1}

.grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;padding:16px 16px 15px;border-radius:14px;
  background:rgba(15,23,42,.78);border:1px solid rgba(51,65,85,.85)}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899,#22d3ee);background-size:300% 100%;animation:flow 6s linear infinite}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.code{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:1.5px;color:#22d3ee}
.st{display:inline-flex;align-items:center;gap:6px;font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:1.5px;padding:3px 8px;border-radius:999px}
.st.live{color:#86efac;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35)}
.st.int{color:#67e8f9;background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.3)}
.st.ship{color:#cbd5e1;background:rgba(148,163,184,.10);border:1px solid rgba(148,163,184,.3)}
.st .dot{width:6px;height:6px}
.name{font:700 16.5px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;color:#f8fafc}
.meta{font:500 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;color:#a78bfa;margin:5px 0 9px}
.desc{font:400 13.2px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;color:#94a3b8;flex:1;margin-bottom:12px}
.chip{font-size:11px;padding:3px 7px}
.more{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;border-style:dashed;text-align:center}
.big{font:800 40px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;line-height:1}
.ms{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:3px;color:#94a3b8;margin-top:10px;line-height:1.6}
.frame{height:930px}.root{height:100%}</style>
        <div class="frame"><div class="root">
<div class="label"><span class="line"></span><span class="lt">FEATURED WORK</span><span class="lr">10+ projects shipped</span></div>
<div class="grid">
  <div class="card up" style="animation-delay:0.20s">
    <div class="top"><span class="code">NADIA</span><span class="st live"><span class="dot"></span>LIVE</span></div>
    <div class="name">Network Monitoring System</div>
    <div class="meta">SATRIA-1 HUB · BAKTI · 2024</div>
    <div class="desc">Monitoring dashboard for the SATRIA-1 satellite HUB in Jayapura, integrating FortiGate, Huawei Core Switch &amp; HPE ProLiant. Used daily by the operations team.</div>
    <div class="chips"><span class="chip">Next.js</span><span class="chip">MUI</span><span class="chip">REST</span><span class="chip">JWT</span></div>
  </div><div class="card up" style="animation-delay:0.29s">
    <div class="top"><span class="code">VIONA</span><span class="st live"><span class="dot"></span>LIVE</span></div>
    <div class="name">Multi-HUB NMS Platform</div>
    <div class="meta">Jayapura · Manokwari · Timika</div>
    <div class="desc">Network monitoring across three BAKTI KOMINFO satellite HUBs with map-based topology, alert routing and unified device status.</div>
    <div class="chips"><span class="chip">Next.js</span><span class="chip">Google Maps</span><span class="chip">AWS</span></div>
  </div><div class="card up" style="animation-delay:0.38s">
    <div class="top"><span class="code">BENGGALA</span><span class="st live"><span class="dot"></span>LIVE</span></div>
    <div class="name">Procurement Monitoring · LKPP</div>
    <div class="meta">BIS Data · 2026</div>
    <div class="desc">Real-time dashboard for Indonesia's national procurement agency, tracking tender methods, budget allocation and top work units.</div>
    <div class="chips"><span class="chip">Next.js</span><span class="chip">Dashboard</span><span class="chip">REST</span></div>
  </div><div class="card up" style="animation-delay:0.47s">
    <div class="top"><span class="code">ELARA</span><span class="st int">INTERNAL</span></div>
    <div class="name">Enterprise AI Chat Assistant</div>
    <div class="meta">BIS Data · 2025</div>
    <div class="desc">Conversational AI for reasoning, drafting, planning and Q&amp;A across text, documents, sheets and slides.</div>
    <div class="chips"><span class="chip">Next.js</span><span class="chip">AI Chat</span><span class="chip">Markdown</span></div>
  </div><div class="card up" style="animation-delay:0.56s">
    <div class="top"><span class="code">ARTZ HR</span><span class="st int">INTERNAL</span></div>
    <div class="name">HR Platform — Full-Stack Dart</div>
    <div class="meta">BIS Data · 2024</div>
    <div class="desc">End-to-end HR: attendance, payroll, leave and role-based access, mobile-first for field employees with audit logs.</div>
    <div class="chips"><span class="chip">Flutter</span><span class="chip">Frog</span><span class="chip">Dart</span><span class="chip">PostgreSQL</span></div>
  </div><div class="card up" style="animation-delay:0.65s">
    <div class="top"><span class="code">BDI CHAT</span><span class="st int">INTERNAL</span></div>
    <div class="name">Real-Time Messaging + AI</div>
    <div class="meta">BIS Data · 2024</div>
    <div class="desc">Real-time chat with an AI assistant: WebSocket transport, full-text search, push notifications and offline cache.</div>
    <div class="chips"><span class="chip">Flutter</span><span class="chip">Frog</span><span class="chip">WebSocket</span><span class="chip">PostgreSQL</span></div>
  </div><div class="card up" style="animation-delay:0.74s">
    <div class="top"><span class="code">BEETPOS</span><span class="st ship">SHIPPED</span></div>
    <div class="name">POS &amp; Clinic Back-Office</div>
    <div class="meta">Life Tech · 2021–2023</div>
    <div class="desc">UI/UX and back-office for a multi-tenant POS used by retail and clinics, with Tokopedia &amp; Shopee sync and QRIS payments.</div>
    <div class="chips"><span class="chip">React</span><span class="chip">Vue.js</span><span class="chip">Vuetify</span><span class="chip">Figma</span></div>
  </div><div class="card up" style="animation-delay:0.83s">
    <div class="top"><span class="code">CRM MRT</span><span class="st ship">SHIPPED</span></div>
    <div class="name">Customer Relationship Mgmt</div>
    <div class="meta">Life Tech · 2021–2023</div>
    <div class="desc">CRM designed and built from scratch: payment integration, role-based dashboards and a customer activity timeline.</div>
    <div class="chips"><span class="chip">Vue.js</span><span class="chip">Vuetify</span><span class="chip">REST API</span></div>
  </div><div class="card up" style="animation-delay:0.92s">
    <div class="top"><span class="code">LOOKUP IP</span><span class="st int">INTERNAL</span></div>
    <div class="name">Internal Tools · LNM Module</div>
    <div class="meta">BIS Data · 2024</div>
    <div class="desc">Tracks device IP, geolocation and network data; AWS infrastructure maintenance and bug-fix support.</div>
    <div class="chips"><span class="chip">React</span><span class="chip">Node.js</span><span class="chip">AWS</span><span class="chip">Maps API</span></div>
  </div>
</div>
</div></div>
      </div>
    </foreignObject>
    
    <circle cx="238.1" cy="103.5" r="3" fill="none" stroke="#22c55e" stroke-width="2" class="ping" style="animation-delay:0.00s"/><circle cx="517.7" cy="103.5" r="3" fill="none" stroke="#22c55e" stroke-width="2" class="ping" style="animation-delay:0.35s"/><circle cx="797.4" cy="103.5" r="3" fill="none" stroke="#22c55e" stroke-width="2" class="ping" style="animation-delay:0.70s"/>
